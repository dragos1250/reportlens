server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;

    # Only the public API is proxied; /actuator stays inside the Docker network.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        # Overwrite, never append: a client-sent X-Forwarded-For must not reach the backend.
        # The backend trusts this header only from this proxy's address (TRUSTED_PROXIES).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;      # stream PDFs as they arrive
        proxy_read_timeout 120s;  # a comparison can take several seconds
        client_max_body_size 64k; # questions and selections are small
    }

    # Explicit, so it does not fall through to the app's index.html with a 200.
    location /actuator {
        return 404;
    }

    location / {
        try_files $uri /index.html;
    }
}

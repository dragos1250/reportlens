server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;

    # Only the public API is proxied; /actuator stays inside the Docker network.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        # Overwrite, never append: a client-sent X-Forwarded-For must not reach the backend.
        # The backend trusts this header only from this proxy's address (TRUSTED_PROXIES).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;      # stream PDFs as they arrive
        proxy_read_timeout 120s;  # a comparison can take several seconds
        client_max_body_size 64k; # questions and selections are small
    }

    # Uploads: the PDF is the request body. nginx allows a little more than the default
    # 50 MB limit; the backend enforces the exact limit (UPLOAD_MAX_MB) while reading.
    location = /api/uploads {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;  # overwrite, as below
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 60m;
        proxy_request_buffering off;  # stream the file on instead of storing it first
        proxy_read_timeout 120s;
    }

    # Explicit, so it does not fall through to the app's index.html with a 200.
    location /actuator {
        return 404;
    }

    # ES modules. nginx's mime.types maps .js but not .mjs, so pdf.js's worker
    # (pdf.worker.min-*.mjs) went out as application/octet-stream and the browser refused
    # to run it. A types block here applies to this location only; elsewhere the full
    # mime.types list still holds. A missing module is a 404, never the app's index.html.
    location ~* \.mjs$ {
        types { text/javascript mjs; }
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}

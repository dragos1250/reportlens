spring.application.name=backend
server.port=8080

# PostgreSQL from docker-compose.yml. The password has no default: set POSTGRES_PASSWORD
# in the environment. 127.0.0.1, not localhost: the port is published on IPv4 only.
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:127.0.0.1}:${POSTGRES_PORT:5432}/${POSTGRES_DB:reportlens}
spring.datasource.username=${POSTGRES_USER:reportlens}
spring.datasource.password=${POSTGRES_PASSWORD:}

# Flyway owns schema "app"; Hibernate only checks that the entities match it.
spring.flyway.schemas=app
spring.flyway.default-schema=app
spring.jpa.properties.hibernate.default_schema=app
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Errors as RFC 9457 problem details (JSON with type, title, status, detail)
spring.mvc.problemdetails.enabled=true

# FastAPI service from ai-service/ (uvicorn api.main:app --port 8000)
reportlens.ai-service.url=${AI_SERVICE_URL:http://127.0.0.1:8000}
reportlens.ai-service.read-timeout=60s

# Health check for Docker: /actuator/health only, without details. nginx proxies /api only,
# so the endpoint is reachable inside the Docker network, not from the browser.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Limits on the LLM route (POST /api/conversations/{id}/messages); 429 with Retry-After.
reportlens.limits.requests-per-minute=${LIMIT_REQUESTS_PER_MINUTE:10}
reportlens.limits.per-ip-daily-usd=${LIMIT_PER_IP_DAILY_USD:0.05}
reportlens.limits.global-daily-usd=${LIMIT_GLOBAL_DAILY_USD:1.00}
# Uploading reports: off unless enabled, so a public instance is safe if the variable is missing.
reportlens.uploads.enabled=${UPLOADS_ENABLED:false}
reportlens.uploads.max-mb=${UPLOAD_MAX_MB:50}
reportlens.uploads.per-hour=${UPLOADS_PER_HOUR:3}

# Comma-separated proxy addresses whose X-Forwarded-For is trusted; empty = trust none.
reportlens.limits.trusted-proxies=${TRUSTED_PROXIES:}

# Spoken answers with ElevenLabs: off unless both the key and a voice id are set (the browser
# voice works without them). The key is read here only and never logged.
reportlens.speech.api-key=${ELEVENLABS_API_KEY:}
reportlens.speech.voice-id=${ELEVENLABS_VOICE_ID:}
reportlens.speech.model=${ELEVENLABS_MODEL:eleven_flash_v2_5}
reportlens.speech.base-url=https://api.elevenlabs.io
reportlens.speech.max-chars=${SPEECH_MAX_CHARS:400}
reportlens.speech.per-minute=${SPEECH_PER_MINUTE:5}
reportlens.speech.per-ip-daily-chars=${SPEECH_PER_IP_DAILY_CHARS:2000}
reportlens.speech.global-daily-chars=${SPEECH_GLOBAL_DAILY_CHARS:20000}
# Under the free plan's 10,000 credits a month (Flash v2.5: 0.5 to 1 credit per character).
reportlens.speech.monthly-chars=${ELEVENLABS_MONTHLY_CHARS:8000}
